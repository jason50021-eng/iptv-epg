name: Build TV guide

on:
  schedule:
    - cron: '23 8 * * *'   # every day, 2:23 AM Central (standard time)
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  match:
    # Re-reads the provider's channel list and re-matches every US channel to guide sources, so renamed or
    # new channels are picked up automatically. If anything looks wrong, the last good matching is kept.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: iptv-org/epg
          path: epg
          sparse-checkout: sites
      - name: Read channel list from provider
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: python3 channels.py channels.new.json && mv channels.new.json channels.json || echo "kept saved channel list"
      - name: Match channels
        id: match
        env:
          EPG_SITES: epg/sites
          IPTV_ORG_DB: work/channels.csv
          CHANNELS: channels.json
          MATCH_WORK: work
          MATCH_OUT: .
          EPGSHARE_LISTS: work/epgshare
        run: |
          mkdir -p work/epgshare
          cp mapping.json work/previous-mapping.json
          for t in US2 US_SPORTS1 FANDUEL1 US_LOCALS1 PLEX1 DISTROTV1; do
            curl -sSfL -m 120 -o work/epgshare/$t.txt https://epgshare01.online/epgshare01/epg_ripper_$t.txt \
              || echo "epgshare01 list $t not available"
          done
          curl -sSfL -o work/channels.csv https://raw.githubusercontent.com/iptv-org/database/master/data/channels.csv
          python3 matching/match.py && python3 matching/gen.py
          python3 - <<'PY'
          import json, sys
          old = json.load(open('work/previous-mapping.json'))
          new = json.load(open('mapping.json'))
          print(f'guide entries: before {len(old)}, now {len(new)}')
          if len(new) < 0.9 * len(old):
              sys.exit('matching lost more than 10% of channels; keeping the previous matching')
          PY
      - name: Keep previous matching if this run failed
        if: failure() && steps.match.outcome == 'failure'
        run: git checkout -- mapping.json sources manual-fixes.txt no-guide.txt && echo "restored last good matching"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched
          path: |
            mapping.json
            channels.json
            sources/
          retention-days: 3
      - name: Save matching to main
        if: success()
        run: |
          git add mapping.json sources manual-fixes.txt no-guide.txt channels.json
          git -c user.name=guide-bot -c user.email=guide-bot@users.noreply.github.com commit -q -m "matching $(date -u +%F)" || exit 0
          git pull -q --rebase --autostash origin main || true
          git push -q || echo "matching not saved (main changed during the run)"

  grab:
    needs: match
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true          # one source failing must not stop the guide
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: tvpassport
            args: --days=4 --maxConnections=5
          - group: ontvtonight
            args: --days=4 --maxConnections=2
          - group: other
            args: --days=4 --maxConnections=5
          - group: epgshare
            args: ""
    steps:
      - uses: actions/checkout@v5
      - name: Use tonight's matching
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: matched
      - uses: actions/checkout@v5
        with:
          repository: iptv-org/epg
          path: epg
          sparse-checkout: ${{ matrix.group == 'epgshare' && 'README.md' || '' }}
      - uses: actions/setup-node@v5
        if: matrix.group != 'epgshare'
        with:
          node-version: 22
      - name: Install grabber
        if: matrix.group != 'epgshare'
        working-directory: epg
        run: npm ci --no-audit --no-fund
      - name: Grab ${{ matrix.group }}
        working-directory: epg
        run: |
          # start from yesterday (Central time): source sites split days on Eastern/UTC midnight, so
          # tonight's late listings sit on the previous day's page. build.py drops shows that already ended.
          export CURR_DATE=$(TZ=America/Chicago date -d yesterday +%F)
          if [ "${{ matrix.group }}" = epgshare ]; then
            # epgshare01 publishes whole files: download each once and keep only our channels (fast)
            python3 ../epgshare_grab.py .. > ../grab-epgshare.log 2>&1 || true
          else
            npm run grab -- --channels=../sources/${{ matrix.group }}.channels.xml \
              --output=../raw-${{ matrix.group }}.xml --timeout=30000 ${{ matrix.args }} \
              > ../grab-${{ matrix.group }}.log 2>&1 || true
          fi
          tail -n 25 ../grab-${{ matrix.group }}.log
          grep -c 'ERR:' ../grab-${{ matrix.group }}.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.group }}
          path: |
            raw-${{ matrix.group }}*.xml
            grab-${{ matrix.group }}.log
          retention-days: 3
          if-no-files-found: warn

  publish:
    needs: [match, grab]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep last night's guide and channel list for the report
        run: |
          cp channels.json prev-channels.json
          git fetch -q --depth=1 origin guide && git show origin/guide:guide.xml.gz > prev-guide.xml.gz || true
      - name: Use tonight's matching
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: matched
      - uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: raw-*
          merge-multiple: true
      - name: Build guide.xml.gz
        run: python3 build.py guide.xml.gz raw/raw-*.xml | tee status.txt
      - name: Add live game listings
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: python3 events.py guide.xml.gz --history prev-guide.xml.gz | tail -n 3
      - name: Write report (what lost listings since last night)
        run: python3 report.py prev-guide.xml.gz guide.xml.gz prev-channels.json channels.json report.md || true
      - name: Publish to the "guide" branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publish.sh
      - name: Save run status (also keeps the daily schedule active)
        run: |
          date -u '+Last run: %F %H:%M UTC' | cat - status.txt > status.tmp && mv status.tmp status.txt
          git add status.txt report.md
          git -c user.name=guide-bot -c user.email=guide-bot@users.noreply.github.com commit -q -m "status $(date -u +%F)" || exit 0
          git pull -q --rebase --autostash origin main || true
          git push -q || echo "status not saved (main changed during the run)" 
